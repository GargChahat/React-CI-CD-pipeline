name: "CD Pipeline"

on:
    workflow_run:
        workflows: ["Sample React CI workflow"]
        types:
            - completed

jobs:
    deploy:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: macos-latest
        permissions:
            actions: read
        environment: vecel_token

        steps:
            - name: "setup nodejs"
              uses: actions/setup-node@v4
              with:
                node-version: 22
            
            - name: "setup vercel cli"
              run: npm install -g vercel

            - name: "Download build files"
              uses: actions/download-artifact@v4
              with:
                  name: react-build
                  run-id: ${{ github.event.workflow_run.id }}
                  repository: ${{ github.repository }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: "Deploy to Vercel"
              run: |
                  if [ -z "$VERCEL_TOKEN" ]; then
                    echo "::error::vecel_token is not configured for the vecel_token environment."
                    exit 1
                  fi
                  vercel --prod --token "$VERCEL_TOKEN" --confirm --name=cicdproject
              env:
                  VERCEL_TOKEN: ${{ secrets.vecel_token }}