name: "CD Pipeline"

on:
    workflow_run:
        workflows: ["Sample React CI workflow"]
        types:
            - completed

jobs:
    deploy:
        runs-on: macos-latest
        environment: production

        steps:
            - name: "setup nodejs"
              uses: actions/setup-node@v4
              with:
                node-version: 22
            
            - name: "setup vercel cli"
              run: npm install -g vercel

            - name: "Download build files"
              uses: actions/download-artifact@v4
              with:
                  name: react-build
                  run-id: ${{ github.event.workflow_run.id }}

            - name: "Deploy to Vercel"
              run: vercel --prod --token ${{ secrets.VECEL_TOKEN }} --confirm --name=cicdproject
              env:
                  VERCEL_TOKEN: ${{ secrets.VECEL_TOKEN }}